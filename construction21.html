<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Construction 21 — The Definitive Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-primary: 'Poppins', sans-serif;
            --font-display: 'Roboto Condensed', sans-serif;
            --color-gold: #e0b757;
            --color-gold-dark: #b8964c;
            --color-felt: #2a623d;
            --color-felt-dark: #1e4d30;
            --color-background: #121212;
            --color-surface: #181820;
            --color-surface-light: #282840;
            --color-white: #f5f5f5;
            --color-danger: #ff5252;
            --color-success: #76ff03;
            --color-black: #212121;
            --color-neutral: #ffa726;
        }
        html, body {
            height: 100%; width: 100%; margin: 0; padding: 0;
            background: var(--color-background);
            color: var(--color-white);
            font-family: var(--font-primary);
        }
        body {
            display: grid;
            grid-template-rows: auto 1fr auto;
            grid-template-areas: "header" "main" "footer";
            min-height: 100vh;
        }
        header { grid-area: header; }
        main { grid-area: main; }
        footer { grid-area: footer; }

        .game-header {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(30,30,30,0.85);
            backdrop-filter: blur(8px);
            padding: 0.75rem 1.5rem;
            border-bottom: 1.5px solid var(--color-surface-light);
        }
        .profile-info {
            display: flex; align-items: center; gap: 2rem;
        }
        #profile-name { font-size: 2rem; font-family: var(--font-display); font-weight: 700; color: var(--color-gold);}
        #player-balance { font-size: 1.3rem; font-family: var(--font-display);}
        .header-btns {
            display: flex; gap: 0.75rem;
        }
        .header-btns button {
            background: none; border: none; color: var(--color-white);
            font-size: 1.25rem; padding: 0.5rem; cursor: pointer;
            border-radius: 50%; transition: background 0.2s;
        }
        .header-btns button:focus, .header-btns button:hover {
            background: rgba(255,255,255,0.18);
        }
        .main-content {
            display: flex; align-items: center; justify-content: center; height: 100%;
            background: radial-gradient(ellipse at 70% 30%, #ffd70011, transparent 60%);
        }
        .game-table {
            position: relative;
            width: min(100vw, 1100px);
            aspect-ratio: 16 / 10;
            background:
                repeating-linear-gradient(135deg, rgba(255,255,255,0.017) 0 4px, transparent 4px 12px),
                radial-gradient(circle at 60% 30%, rgba(255,255,255,0.06), transparent 60%),
                linear-gradient(var(--color-felt), var(--color-felt-dark));
            border-radius: 90px;
            border: 10px solid var(--color-gold-dark);
            box-shadow: 0 0 120px 10px #e0b75744, 0 12px 40px rgba(0,0,0,0.7), 0 0 0 10px #b8964c44 inset;
            overflow: visible;
        }
        #ambient-particles {
            position: absolute; inset: 0; pointer-events: none; z-index: 1;
        }
        #ambient-particles div {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.07);
            opacity: 0.13;
            animation: particle-float 8s infinite alternate;
        }
        @keyframes particle-float {
            from { transform: translateY(0);}
            to   { transform: translateY(-22px);}
        }
        #dealer-hand, #player-hands {
            display: flex; gap: 1.5rem; min-height: 120px; align-items: center;
        }
        #dealer-hand { position: absolute; top: 8%; left: 50%; transform: translateX(-50%);}
        #player-hands { position: absolute; bottom: 24%; left: 50%; transform: translateX(-50%);}
        .betting-area {
            position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
            display: flex; gap: 3rem;
        }
        .bet-spot {
            display: flex; flex-direction: column; align-items: center;
            width: 84px; height: 84px; background: rgba(224,183,87,0.07);
            border: 2.5px solid var(--color-gold); border-radius: 50%;
            box-shadow: 0 0 14px rgba(0,0,0,0.27) inset;
            cursor: pointer;
            position: relative;
            transition: box-shadow 0.33s, border-color 0.33s;
        }
        .bet-spot.has-bet,
        .bet-spot:focus,
        .bet-spot:active {
            box-shadow: 0 0 24px 5px var(--color-gold), 0 0 0 4px var(--color-gold) inset;
            border-color: var(--color-gold);
        }
        .bet-spot__chips { min-height: 26px; }
        .bet-spot__amount { font-weight: 600; font-size: 1.1rem; color: var(--color-gold);}
        .card {
            width: 74px; height: 110px; border-radius: 8px;
            box-shadow: 0 3px 12px #0009, 0 0 0 1.5px #fff4 inset;
            background: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            font-family: var(--font-display); position: relative;
            transition: box-shadow 0.25s, transform 0.22s;
        }
        .card--red { color: #cc2323; }
        .card__corner { font-size: 1.04rem; font-weight: 700; }
        .card__suit { font-size: 2rem; }
        .hand.is-active {
            animation: pulse-active-hand 1.2s infinite alternate;
        }
        @keyframes pulse-active-hand {
            from { box-shadow: 0 0 18px 2px #e0b75744, 0 0 0 2px #e0b75755 inset; }
            to { box-shadow: 0 0 32px 8px #e0b757bb, 0 0 0 4px #e0b757cc inset; }
        }
        .card.dealing {
            position: fixed !important; pointer-events: none; z-index: 500;
            animation: card-deal-fly 0.60s cubic-bezier(.17,.67,.56,1.12) forwards;
            will-change: transform, opacity;
        }
        @keyframes card-deal-fly {
            0%   { opacity: 0.3; transform: translate(var(--from-x,0), var(--from-y,0)) scale(0.85) rotate(-8deg);}
            80%  { opacity: 1;   transform: translate(calc(var(--to-x,0) * 1.05), calc(var(--to-y,0) * 1.08)) scale(1.04) rotate(3deg);}
            100% { opacity: 1;   transform: translate(var(--to-x,0), var(--to-y,0)) scale(1) rotate(0);}
        }
        .chip {
            width: 54px; height: 54px; border-radius: 50%;
            font-size: 1.1rem; font-weight: 700; color: var(--color-white);
            border: 3px solid var(--color-gold); background: linear-gradient(145deg, #252525 60%, #3c2705 100%);
            box-shadow: 0 2px 8px #b8964c44, 0 0 10px #ffd70055 inset;
            cursor: pointer; transition: box-shadow 0.2s, transform 0.15s;
        }
        .chip.is-selected {
            box-shadow: 0 0 16px 0px var(--color-gold), 0 0 0 3px var(--color-gold) inset;
            transform: scale(1.08);
        }
        .chip:not(:disabled):hover {
            box-shadow: 0 0 16px 3px var(--color-gold), 0 0 0 3px var(--color-gold) inset;
            transform: scale(1.11) translateY(-3px);
        }
        .chip.flying {
            position: fixed !important; z-index: 900;
            animation: chip-fly 0.55s cubic-bezier(.57,.02,.36,.98) forwards;
            will-change: transform, opacity;
        }
        @keyframes chip-fly {
            0%   { opacity: 0.7; transform: translate(var(--from-x,0), var(--from-y,0)) scale(0.7);}
            80%  { opacity: 1;   transform: translate(calc(var(--to-x,0) * 1.12), calc(var(--to-y,0) * 1.10)) scale(1.10);}
            100% { opacity: 1;   transform: translate(var(--to-x,0), var(--to-y,0)) scale(1);}
        }
        .player-controls {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(30,30,30,0.88); backdrop-filter: blur(8px);
            border-top: 1.5px solid var(--color-surface-light);
            padding: 1.2rem 2rem;
        }
        #chip-tray { display: flex; gap: 1.3rem; }
        .action-bar { display: flex; gap: 0.7rem; }
        .action-button {
            padding: 0.85rem 1.3rem; border-radius: 8px; font-size: 1.05rem;
            border: none; cursor: pointer; font-family: var(--font-display); font-weight: 700;
            background: var(--color-gold); color: var(--color-black);
            box-shadow: 0 2px 8px #b8964c44;
            transition: background 0.2s, color 0.2s, box-shadow 0.18s, transform 0.12s;
        }
        .action-button:not(:disabled):hover {
            box-shadow: 0 0 18px 2px var(--color-gold), 0 0 0 2px var(--color-gold) inset;
            background: linear-gradient(90deg, var(--color-gold) 90%, #fff7 100%);
            color: var(--color-black);
            transform: translateY(-2px) scale(1.05);
        }
        .action-button.is-recommended {
            animation: action-recommend-glow 1.1s infinite alternate;
        }
        @keyframes action-recommend-glow {
            from { box-shadow: 0 0 18px 0px var(--color-success), 0 0 0 2px var(--color-success) inset;}
            to   { box-shadow: 0 0 28px 8px var(--color-success), 0 0 0 4px var(--color-success) inset;}
        }
        .action-button:active { transform: scale(0.98); }
        .action-button:disabled { background: #8884; color: #eee; cursor: not-allowed; }
        /* Modal Overlay Animations */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(18,18,18,0.95);
            z-index: 1000; align-items: center; justify-content: center;
            transition: background 0.4s;
        }
        .modal-overlay.is-visible {
            display: flex; animation: overlay-in 0.33s;
        }
        .modal-content {
            backdrop-filter: blur(14px) brightness(1.13);
            background: rgba(30,30,38,0.98);
            border-radius: 24px;
            box-shadow: 0 16px 96px #000c, 0 0 0 6px var(--color-gold) inset;
            padding: 3rem 2.2rem 2.2rem 2.2rem;
            min-width: 360px; max-width: 96vw;
            text-align: center; position: relative;
            animation: modal-fade-in 0.34s cubic-bezier(.17,.67,.83,.67);
        }
        @keyframes modal-fade-in {
            from { transform: scale(0.93) translateY(60px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        @keyframes overlay-in { from { opacity: 0; } to { opacity: 1; } }
        .modal-close-btn {
            position: absolute; top: 1.3rem; right: 1.3rem; background: none; border: none;
            font-size: 1.5rem; color: var(--color-white); cursor: pointer;
            transition: color 0.16s;
        }
        .modal-close-btn:hover { color: var(--color-gold); }
        /* PREMIUM WIN/LOSS MODAL CUSTOMIZATION */
        #outcome-modal .modal-content {
            border: 0;
            background: linear-gradient(145deg, #191925 70%, #373760 100%);
            color: #fff;
            box-shadow: 0 0 64px #ffecb366, 0 6px 32px #212123cc;
            position: relative;
            overflow: visible;
        }
        .modal-victory { color: var(--color-success);}
        .modal-defeat { color: var(--color-danger);}
        .outcome-hand-results {
            display: flex; flex-wrap: wrap; gap: 2rem; justify-content: center; margin: 1.5rem 0;
        }
        .outcome-hand {
            background: rgba(255,255,255,0.05);
            border-radius: 16px; padding: 1.3rem 1.3rem 0.8rem 1.3rem;
            min-width: 160px; box-shadow: 0 2px 8px #e0b75733;
            display: flex; flex-direction: column; align-items: center;
            margin-bottom: 0.4rem;
        }
        .outcome-hand .hand-cards {
            display: flex; gap: 0.5rem; margin-bottom: 0.5rem;
        }
        .outcome-hand .hand-payout {
            margin-top: 0.7rem;
            font-weight: bold;
            font-size: 1.15rem;
        }
        .sidebet-win {
            display: inline-block;
            padding: 0.25em 0.7em;
            margin: 0.1em 0.2em 0 0;
            border-radius: 12px;
            background: linear-gradient(90deg, #ffe47a, #e4bc2c 90%);
            color: #514200;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 1px 7px #ffe47a66;
            vertical-align: middle;
        }
        .modal-net-result {
            margin-top: 1.4rem;
            font-size: 2rem;
            font-family: var(--font-display);
            font-weight: 700;
            transition: color 0.22s;
        }
        .modal-net-result.positive { color: var(--color-success);}
        .modal-net-result.negative { color: var(--color-danger);}
        .modal-net-result.zero { color: var(--color-neutral);}
        .confetti-emoji {
            font-size: 2.5rem; margin: 0 0.45rem; vertical-align: middle; animation: confetti-pop 0.9s cubic-bezier(.17,.67,.67,1.07) 1;
        }
        @keyframes confetti-pop {
            0% { transform: scale(0.8) translateY(30px) rotate(-32deg);}
            30% { transform: scale(1.5) translateY(-12px) rotate(6deg);}
            80% { transform: scale(0.94) translateY(0) rotate(-6deg);}
            100% { transform: scale(1) translateY(0) rotate(0);}
        }
        .shake {
            animation: shake 0.32s cubic-bezier(.35,1.8,.71,-0.51);
        }
        @keyframes shake {
            10% { transform: translateX(-10px);}
            40% { transform: translateX(8px);}
            60% { transform: translateX(-8px);}
            80% { transform: translateX(7px);}
            100% { transform: translateX(0);}
        }
        /* Accessibility/Focus Styles */
        .bet-spot:focus { outline: 3px solid var(--color-gold); }
        .action-button:focus { outline: 2px solid var(--color-gold); }
        .color-swatch.selected { border: 3px solid var(--color-gold);}
        /* ... other modal and stat styles unchanged ... */
    </style>
</head>
<body>
    <header class="game-header">
        <div class="profile-info">
            <h1 id="profile-name"></h1>
            <span id="player-balance"></span>
        </div>
        <div class="header-btns">
            <button id="logout-btn" aria-label="Logout"><span>⎋</span></button>
            <button id="payouts-btn" aria-label="Show Payouts"><span>💰</span></button>
            <button id="stats-btn" aria-label="Show Stats"><span>📊</span></button>
            <button id="settings-btn" aria-label="Show Settings"><span>⚙️</span></button>
        </div>
    </header>
    <main class="main-content">
        <div class="game-table" id="game-table">
            <div id="ambient-particles"></div>
            <svg class="table-rules-svg" viewBox="0 0 1000 562.5">
                <path id="table-text-path" fill="none" d="M 150,400 A 400,180 0 0,1 850,400"></path>
                <text class="table-rules-text">
                    <textPath href="#table-text-path" startOffset="50%" text-anchor="middle">
                        BLACKJACK PAYS 3 TO 2 • DEALER MUST STAND ON ALL 17s
                    </textPath>
                </text>
            </svg>
            <div id="dealer-hand"></div>
            <div id="player-hands"></div>
            <div class="betting-area">
                <div class="bet-spot" id="main-bet-spot" data-bet-type="main">
                    <span id="main-bet-amount"></span>
                    <div class="bet-spot__chips"></div>
                </div>
                <div class="bet-spot" id="pp-bet-spot" data-bet-type="pp">
                    <span id="pp-bet-amount"></span>
                    <div class="bet-spot__chips"></div>
                </div>
                <div class="bet-spot" id="plus3-bet-spot" data-bet-type="plus3">
                    <span id="plus3-bet-amount"></span>
                    <div class="bet-spot__chips"></div>
                </div>
            </div>
            <div class="deck" id="deck" style="position: absolute; right: 3%; top: 8%; width: 68px; height: 98px; background: #233"></div>
        </div>
    </main>
    <footer class="player-controls">
        <div id="chip-tray">
            <button class="chip" data-value="5">5</button>
            <button class="chip" data-value="10">10</button>
            <button class="chip" data-value="25">25</button>
            <button class="chip" data-value="100">100</button>
        </div>
        <div class="action-bar" id="action-bar" data-state="betting">
            <button class="action-button" id="deal-btn" data-action="deal">Deal</button>
            <button class="action-button" id="clear-btn" data-action="clear">Clear</button>
            <button class="action-button" id="hit-btn" data-action="hit">Hit</button>
            <button class="action-button" id="stand-btn" data-action="stand">Stand</button>
            <button class="action-button" id="double-btn" data-action="double">Double</button>
            <button class="action-button" id="split-btn" data-action="split">Split</button>
            <button class="action-button" id="rebet-btn" data-action="rebet">Re-Bet</button>
            <button class="action-button" id="new-game-btn" data-action="new-game">New Game</button>
        </div>
    </footer>
    <!-- MODALS -->
    <div class="modal-overlay" id="outcome-modal" role="dialog" aria-modal="true">
        <div class="modal-content" id="outcome-modal-content">
            <button class="modal-close-btn" aria-label="Close" tabindex="0">×</button>
            <div id="modal-victory-label" class="modal-victory" style="display:none;"><span class="confetti-emoji">🎉</span> You Win! <span class="confetti-emoji">🎉</span></div>
            <div id="modal-defeat-label" class="modal-defeat" style="display:none;">You Lose.</div>
            <div id="modal-push-label" class="modal-net-result zero" style="display:none;">Push.</div>
            <div class="outcome-hand-results" id="outcome-hand-results"></div>
            <div id="outcome-sidebets"></div>
            <div id="outcome-net" class="modal-net-result"></div>
            <button class="action-button" id="modal-new-game-btn" tabindex="0" style="margin-top:2.1rem;">Play Again</button>
        </div>
    </div>
    <!-- ... your stats, payouts, settings modals as before ... -->
    <script type="module" src="js/construction21-ui.js"></script>
    <script>
    // AMBIENT PARTICLES
    (function createAmbientParticles(count = 28) {
        const container = document.getElementById('ambient-particles');
        for (let i = 0; i < count; i++) {
            const dot = document.createElement('div');
            dot.style.left = `${Math.random() * 100}%`;
            dot.style.top = `${Math.random() * 100}%`;
            dot.style.width = `${Math.random()*2+1.5}px`;
            dot.style.height = dot.style.width;
            dot.style.opacity = Math.random()*0.6 + 0.11;
            dot.style.background = 'rgba(255,255,255,0.12)';
            dot.style.animationDuration = `${7 + Math.random()*4}s`;
            container.appendChild(dot);
        }
    })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Construction 21 - The Mastered Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto+Condensed:wght@700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Color Palette: Refined for a high-contrast, premium feel */
            --color-gold: #e0b757;
            --color-gold-dark: #c09b40;
            --color-felt: #14453d; /* Dynamic via JS */
            --color-felt-dark: #0f342d;
            --color-background: #121212;
            --color-surface: #1e1e1e;
            --color-surface-light: #2a2a2a;
            --color-success: #76ff03;
            --color-danger: #ff5252;
            --color-neutral: #ffa726;
            --color-black: #000;
            --color-white: #f5f5f5;
            
            /* Typography & Sizing */
            --font-primary: 'Poppins', sans-serif;
            --font-display: 'Roboto Condensed', sans-serif;
            --font-serif: 'Playfair Display', serif;
            --border-radius: 12px;

            /* Shadows */
            --shadow-md: 0 4px 10px rgba(0,0,0,0.4);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.5);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background-color: var(--color-background);
            color: var(--color-white); font-family: var(--font-primary);
        }

        /* --- 1. MASTER PAGE LAYOUT & ATMOSPHERE --- */
        body {
            display: grid;
            grid-template-rows: auto 1fr auto;
            grid-template-areas: "header" "main" "footer";
            background-image: radial-gradient(ellipse at 50% -20%, rgba(255, 215, 112, 0.15), transparent 60%);
        }
        header, main, footer { position: relative; z-index: 10; }
        header { grid-area: header; }
        main { grid-area: main; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        footer { grid-area: footer; }

        .ambient-particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }
        .particle {
            position: absolute; background-color: rgba(255, 215, 0, 0.1);
            border-radius: 50%; animation: drift linear infinite;
        }
        @keyframes drift {
            from { transform: translateY(110vh) translateX(var(--x-start)); }
            to { transform: translateY(-10vh) translateX(var(--x-end)); }
        }

        /* --- 2. HEADER & FEATURE BUTTONS --- */
        .game-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.75rem 1.5rem; background: rgba(18, 18, 18, 0.6);
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--color-surface);
        }
        .header-section { display: flex; align-items: center; gap: 1rem; }
        .balance-display { font-size: 1.5rem; font-weight: bold; font-family: var(--font-display); }
        .balance-display__symbol { color: var(--color-gold); margin-right: 0.5rem; }
        .icon-button { background: none; border: none; color: #a0a0a0; cursor: pointer; transition: all 0.2s ease; }
        .icon-button:hover { color: var(--color-white); transform: scale(1.1); }
        .icon-button svg { width: 24px; height: 24px; }
        #logout-btn { color: var(--color-danger); }

        /* --- 3. GAME TABLE & VISUALS --- */
        .game-table {
            position: relative; width: clamp(320px, 100%, 1200px);
            aspect-ratio: 16 / 10; border-radius: 90px;
            background: linear-gradient(145deg, #4d3a2a, #2c1e14);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 5px 15px rgba(255,255,255,0.1);
            transition: background-image 0.5s ease;
        }
        .game-table::before {
            content: ''; position: absolute; inset: 15px; border-radius: 75px;
            background-image: radial-gradient(ellipse at 50% 50%, var(--color-felt), var(--color-felt-dark));
            box-shadow: inset 0 0 40px rgba(0,0,0,0.7);
            border: 5px solid #2a2018;
        }
        .dealer-area, .player-area, .betting-area {
            position: absolute; width: 100%; display: flex;
            justify-content: center; align-items: center; gap: 1.5rem; z-index: 10;
        }
        .dealer-area { top: 5%; height: 35%; align-items: flex-start; }
        .player-area { bottom: 30%; height: 35%; align-items: flex-end; }
        .betting-area { bottom: 5%; height: 25%; gap: 1rem; }
        .table-rules-svg {
            position: absolute; inset: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none;
        }
        .table-rules-text {
            font-family: var(--font-display); font-size: clamp(0.7rem, 2.5vw, 1.2rem); font-weight: 700;
            text-transform: uppercase; fill: rgba(255, 215, 0, 0.6); letter-spacing: 3px;
        }

        /* --- 4. CARDS, HANDS, AND ENHANCEMENTS --- */
        .hand { display: flex; position: relative; }
        .card {
            position: relative; width: 85px; height: 120px; background-color: #f8f8f8;
            border-radius: 8px; color: var(--color-black); font-family: var(--font-serif);
            font-size: 1.8rem; box-shadow: 0 4px 8px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.2);
            border: 1px solid #ddd;
        }
        .card.is-face-down { background-image: radial-gradient(circle at top left, #a90329, #6d0019); }
        .card--red { color: var(--color-danger); }
        .card__content { display: flex; flex-direction: column; justify-content: space-between; height: 100%; padding: 4px;}
        .card__corner { display: flex; flex-direction: column; align-items: center; line-height: 1; }
        .card__corner span { font-size: 1.5rem; }
        .card__corner svg { width: 16px; height: 16px; }
        .card__corner--bottom { transform: rotate(180deg); }
        .card__suit-main { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .card__suit-main svg { width: 32px; height: 32px; }
        .hand > .card { margin-left: -50px; }
        .hand > .card:first-child { margin-left: 0; }

        /* --- 5. BETTING SPOTS (IMPROVED) --- */
        .bet-spot {
            position: relative;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 3px dashed rgba(255,255,255,0.3);
            transition: all 0.2s ease; cursor: pointer;
            padding: 0.5rem;
        }
        .main-bet-spot { width: 120px; height: 120px; border-radius: 50%; }
        .side-bet-spot { width: 110px; height: 85px; border-radius: var(--border-radius); }
        .bet-spot:hover { border-color: var(--color-gold); }
        .bet-spot.has-bet { border-style: solid; border-color: var(--color-gold); }
        .bet-spot__label { font-size: 0.7rem; font-weight: 700; opacity: 0.7; letter-spacing: 1px; }
        .bet-spot__amount { font-size: 1.2rem; font-family: var(--font-display); font-weight: 700; }
        .bet-spot__chips { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        
        /* --- 6. MODALS & FEATURE PANELS --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(18, 18, 18, 0.7);
            backdrop-filter: blur(8px); z-index: 1000;
            display: grid; place-items: center; opacity: 0; visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.is-visible { opacity: 1; visibility: visible; }
        .modal-content {
            width: clamp(320px, 90%, 500px);
            background: linear-gradient(145deg, var(--color-surface), #1a1a1a);
            border: 1px solid var(--color-surface-light);
            border-radius: 16px;
            box-shadow: var(--shadow-lg), 0 0 0 1px var(--color-surface);
            transform: scale(0.9) translateY(20px); transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1) 0.1s;
        }
        .modal-overlay.is-visible .modal-content { transform: scale(1) translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 2rem; border-bottom: 1px solid var(--color-surface-light); }
        .modal-title { font-family: var(--font-display); font-size: 1.5rem; color: var(--color-gold); text-shadow: 0 1px 3px var(--color-black); }
        .modal-close-btn { background: none; border: none; font-size: 1.75rem; color: #888; cursor: pointer; transition: all 0.2s ease;}
        .modal-close-btn:hover { color: var(--color-white); transform: rotate(90deg); }
        .modal-body { padding: 2rem; }
    </style>
</head>
<body>
    <div class="ambient-particles" id="ambient-particles"></div>

    <header class="game-header">
        <div class="header-section">
            <h1 class="profile-name" id="profile-name">Player</h1>
            <button id="logout-btn" class="icon-button" aria-label="Logout">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M5 20a1 1 0 0 1-1-1v-4a1 1 0 0 1 2 0v4a1 1 0 0 1-1 1zm7-18a1 1 0 0 1 .707.293l4.95 4.95a1 1 0 0 1 0 1.414l-4.95 4.95a1 1 0 0 1-1.414-1.414L15.586 13H5a1 1 0 0 1 0-2h10.586l-3.293-3.293a1 1 0 0 1 .707-1.707zM18 19a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3h1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-1z"/></svg>
            </button>
        </div>
        <div class="balance-display">
            <span class="balance-display__symbol">$</span>
            <span id="player-balance">10000</span>
        </div>
        <div class="header-section">
            <button id="payouts-btn" class="icon-button" aria-label="View Payouts">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M11 17h2v-6h-2v6zm1-15C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zM11 9h2V7h-2v2z"/></svg>
            </button>
            <button id="stats-btn" class="icon-button" aria-label="View Stats">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M3 21h18v-2H3v2zm3-4h4v-7H6v7zm5 0h4V7h-4v10zm5 0h4v-4h-4v4zM3 3v2h18V3H3z"/></svg>
            </button>
            <button id="settings-btn" class="icon-button" aria-label="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M19.829 15.228a3.501 3.501 0 0 1-4.267-2.314 3.493 3.493 0 0 1 0-1.828 3.501 3.501 0 0 1 4.267-2.314l1.838-.532a1 1 0 0 0 .919-1.378 9.516 9.516 0 0 0-2.613-4.542 1 1 0 0 0-1.378.919l-.532 1.838a3.501 3.501 0 0 1-2.314 4.267 3.493 3.493 0 0 1-1.828 0A3.501 3.501 0 0 1 8.772 9.228l-.532-1.838a1 1 0 0 0-1.378-.919A9.516 9.516 0 0 0 2.319 9.08a1 1 0 0 0 .919 1.378l1.838.532A3.501 3.501 0 0 1 9.343 15.228a3.493 3.493 0 0 1 0 1.828 3.501 3.501 0 0 1-4.267 2.314l-1.838.532a1 1 0 0 0-.919 1.378 9.516 9.516 0 0 0 2.613 4.542 1 1 0 0 0 1.378-.919l.532-1.838a3.501 3.501 0 0 1 2.314-4.267 3.493 3.493 0 0 1 1.828 0 3.501 3.501 0 0 1 4.267 4.267l.532 1.838a1 1 0 0 0 1.378.919 9.516 9.516 0 0 0 4.542-2.613 1 1 0 0 0-.919-1.378l-1.838-.532zM12 15a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>
            </button>
        </div>
    </header>
    
    <main>
        <div class="game-table" id="game-table">
            <div class="dealer-area">
                <div class="hand" id="dealer-hand">
                    <!-- JS renders cards here -->
                </div>
            </div>
            <div class="player-area">
                <div class="player-hands-container" id="player-hands">
                    <!-- JS renders player hands here -->
                </div>
            </div>
            <div class="betting-area">
                 <div class="bet-spot side-bet-spot" id="pp-bet-spot" data-bet-type="pp">
                    <span class="bet-spot__label">PERFECT PAIRS</span>
                    <span class="bet-spot__amount" id="pp-bet-amount">$0</span>
                    <div class="bet-spot__chips"></div>
                </div>
                <div class="bet-spot main-bet-spot" id="main-bet-spot" data-bet-type="main">
                    <div class="bet-spot__chips"></div>
                    <span class="bet-spot__amount" id="main-bet-amount">$0</span>
                </div>
                 <div class="bet-spot side-bet-spot" id="plus3-bet-spot" data-bet-type="plus3">
                    <span class="bet-spot__label">21+3</span>
                    <span class="bet-spot__amount" id="plus3-bet-amount">$0</span>
                    <div class="bet-spot__chips"></div>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="player-controls">
        <!-- JS renders chips and action bar here -->
    </footer>

    <!-- All modals are ready to be populated by the UI script -->
    <div class="modal-overlay" id="stats-modal"></div>
    <div class="modal-overlay" id="settings-modal"></div>
    <div class="modal-overlay" id="payouts-modal"></div>
    
</body>
</html>

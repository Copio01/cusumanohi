<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction 21 — Login</title>
    <!-- <link rel="icon" href="./img/cropped-CusumanoH-Ico-1-32x32.png"> -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-gold: #e0b757;
            --color-background: #121212;
            --color-surface: #1e1e1e;
            --color-surface-light: #2a2a2a;
            --color-white: #f5f5f5;
            --color-danger: #ff5252;
            --color-success: #76ff03;
            --color-text-muted: #888;
            --font-primary: 'Poppins', sans-serif;
            --font-display: 'Roboto Condensed', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            height: 100%; width: 100%; margin: 0; padding: 0;
            font-family: var(--font-primary); color: var(--color-white);
        }

        .auth-background {
            position: fixed; inset: 0; background-color: var(--color-background);
            background-image: radial-gradient(ellipse at 50% -50%, rgba(224, 183, 87, 0.1), transparent 60%);
            overflow: hidden; z-index: -1;
        }
        .auth-background::before, .auth-background::after {
            content: ''; position: absolute; inset: 0;
            background-image: linear-gradient(rgba(224, 183, 87, 0.07) 1px, transparent 1px),
                              linear-gradient(to right, rgba(224, 183, 87, 0.07) 1px, transparent 1px);
            animation: pan 60s linear infinite;
        }
        .auth-background::before { background-size: 40px 40px; }
        .auth-background::after { background-size: 80px 80px; animation-duration: 120s; }
        #spotlight {
            position: fixed; width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(224, 183, 87, 0.1) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none;
            transition: transform 0.2s ease-out;
        }
        @keyframes pan { 100% { background-position: 800px 800px; } }

        .auth-page {
            width: 100%; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 1rem;
        }

        .auth-card {
            width: 100%; max-width: 420px;
            background: rgba(30, 30, 30, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid var(--color-surface-light);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .auth-card__content { padding: 2.5rem; }
        
        .auth-header {
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        
        .game-title {
            font-family: var(--font-display);
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--color-gold);
            text-shadow: 0 0 15px rgba(224, 183, 87, 0.4);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .game-title svg {
            width: 32px;
            height: 32px;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
        }
        
        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--color-white);
        }

        /* --- TABS & FORM PANELS (CORRECTED) --- */
        .auth-panel { display: none; }
        .auth-panel.active { display: block; animation: fadeIn 0.5s ease-in-out; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group { margin-bottom: 1.25rem; text-align: left; }
        .form-input-wrapper { position: relative; }
        .form-input-icon { position: absolute; top: 50%; left: 1rem; transform: translateY(-50%); opacity: 0.5; width: 20px; height: 20px; }
        .form-input {
            width: 100%; padding: 0.75rem 1rem 0.75rem 3rem; background: var(--color-surface-light);
            border: 1px solid #444; border-radius: 8px; color: var(--color-white); font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input:focus { outline: none; border-color: var(--color-gold); box-shadow: 0 0 0 3px rgba(224, 183, 87, 0.2); }

        .auth-btn {
            width: 100%; padding: 0.85rem; margin-top: 0.5rem;
            background: linear-gradient(90deg, var(--color-gold), var(--color-gold-dark));
            color: var(--color-black); border: none; border-radius: 8px; font-weight: 700;
            font-size: 1rem; cursor: pointer; transition: all 0.2s ease;
        }
        .auth-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(224, 183, 87, 0.3); }
        .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

        .social-logins { margin: 1.5rem 0; display: flex; flex-direction: column; gap: 0.75rem; }
        .social-btn { display: flex; align-items: center; justify-content: center; gap: 0.75rem; background: var(--color-surface-light); color: var(--color-white); }
        
        .divider { display: flex; align-items: center; text-align: center; color: var(--color-text-muted); margin: 1.5rem 0; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--color-surface-light); }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }

        .form-footer-link {
            background: none; border: none; color: var(--color-gold); font-size: 0.9rem;
            cursor: pointer; text-decoration: underline; padding: 0.5rem;
        }

        .password-strength-meter { display: flex; gap: 4px; height: 5px; margin-top: 0.5rem; }
        .strength-bar { flex: 1; background-color: var(--color-surface-light); border-radius: 5px; transition: background-color 0.3s; }
        .strength-bar.weak { background-color: var(--color-danger); }
        .strength-bar.medium { background-color: #ffc107; }
        .strength-bar.strong { background-color: var(--color-success); }
        
        .message {
            padding: 0.75rem;
            margin-top: 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .message.error {
            background-color: rgba(255, 82, 82, 0.15);
            border: 1px solid var(--color-danger);
            color: var(--color-danger);
            opacity: 1;
        }
        .message.success {
            background-color: rgba(118, 255, 3, 0.15);
            border: 1px solid var(--color-success);
            color: var(--color-success);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="auth-background"><div id="spotlight"></div></div>

    <div class="auth-page">
        <div class="auth-card" id="login-container">
            <div class="auth-card__content">
                <div class="auth-header">
                    <h1 class="game-title">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M10.5,2h3v5h-3V2z M6,9v13h12V9H6z M19,4h-3l-1-1h-4l-1,1H7C5.9,4,5,4.9,5,6v1l14,0V6C20,4.9,19.1,4,19,4z"/></svg>
                        <span>Construction 21</span>
                    </h1>
                    <h2 class="panel-title" id="panel-title">Sign In</h2>
                </div>

                <div class="auth-panels-container">

                    <!-- Login Panel -->
                    <div class="auth-panel active" id="login-panel">
                        <form id="login-form">
                            <div class="form-group">
                                <div class="form-input-wrapper">
                                    <span class="form-input-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg></span>
                                    <input type="email" id="login-email" class="form-input" placeholder="Email" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="form-input-wrapper">
                                    <span class="form-input-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9z"/></svg></span>
                                    <input type="password" id="login-password" class="form-input" placeholder="Password" required>
                                </div>
                            </div>
                            <button id="login-btn" type="submit" class="auth-btn">Sign In</button>
                            <div class="form-footer" style="text-align: right;">
                                <button type="button" class="form-footer-link" data-target="forgot-panel">Forgot Password?</button>
                            </div>
                            <div class="divider">or</div>
                            <div class="social-logins">
                                <button type="button" class="auth-btn social-btn" id="google-signin-btn"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.574l6.19,5.238C42.022,35.15,44,30.02,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path></svg> Sign in with Google</button>
                            </div>
                            <div id="login-message" class="message"></div>
                            <p style="font-size: 0.9rem; color: #888;">No account? <button type="button" class="form-footer-link" data-target="signup-panel">Sign Up</button></p>
                        </form>
                    </div>

                    <!-- Signup Panel -->
                    <div class="auth-panel" id="signup-panel">
                        <form id="signup-form">
                            <div class="form-group">
                                <input type="text" id="signup-name" class="form-input" placeholder="Display Name" required>
                            </div>
                            <div class="form-group">
                                <input type="email" id="signup-email" class="form-input" placeholder="Email" required>
                            </div>
                            <div class="form-group">
                                <input type="password" id="signup-password" class="form-input" placeholder="Password" required>
                                <div class="password-strength-meter" id="password-strength-meter">
                                    <div class="strength-bar"></div><div class="strength-bar"></div><div class="strength-bar"></div>
                                </div>
                            </div>
                            <button id="signup-btn" type="submit" class="auth-btn">Create Account</button>
                            <div id="signup-message" class="message"></div>
                            <p style="font-size: 0.9rem; color: #888;">Already have an account? <button type="button" class="form-footer-link" data-target="login-panel">Sign In</button></p>
                        </form>
                    </div>

                    <!-- Forgot Password Panel -->
                    <div class="auth-panel" id="forgot-panel">
                        <form id="forgot-form">
                            <div class="form-group">
                                <p style="font-size: 0.9rem; color: #ccc; margin-bottom: 1rem;">Enter your email to receive a password reset link.</p>
                                <input type="email" id="forgot-email" class="form-input" placeholder="Email" required>
                            </div>
                            <button id="forgot-btn" type="submit" class="auth-btn">Send Reset Link</button>
                            <div id="forgot-message" class="message"></div>
                            <p style="font-size: 0.9rem; color: #888; margin-top: 1rem;"><button type="button" class="form-footer-link" data-target="login-panel">Back to Sign In</button></p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.9.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVtq6dAEuybJNmTTv8dXBxTVUgw1t0ZMk",
            authDomain: "cusumano-website.firebaseapp.com",
            projectId: "cusumano-website",
            storageBucket: "cusumano-website.appspot.com",
            messagingSenderId: "20051552210",
            appId: "1:20051552210:web:7eb3b22baa3fec184e4a0b"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- UI & State ---
        const spotlight = document.getElementById('spotlight');
        const authCard = document.querySelector('.auth-card');
        const panelTitle = document.getElementById('panel-title');
        
        // --- Form Selectors ---
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const forgotForm = document.getElementById('forgot-form');
        const googleSigninBtn = document.getElementById('google-signin-btn');

        // --- Message Elements ---
        const loginMessage = document.getElementById('login-message');
        const signupMessage = document.getElementById('signup-message');
        const forgotMessage = document.getElementById('forgot-message');

        // --- Event Listeners ---
        document.addEventListener('mousemove', (e) => {
            spotlight.style.transform = `translate(${e.clientX - 200}px, ${e.clientY - 200}px)`;
        });

        const panelTitles = {
            'login-panel': 'Sign In',
            'signup-panel': 'Create Account',
            'forgot-panel': 'Reset Password'
        };

        authCard.addEventListener('click', (e) => {
            if (e.target.matches('.form-footer-link')) {
                const targetPanelId = e.target.dataset.target;
                document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
                document.getElementById(targetPanelId).classList.add('active');
                panelTitle.textContent = panelTitles[targetPanelId] || 'Welcome';
            }
        });

        // --- Firebase Auth Logic ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userDocRef = doc(db, "users", user.uid);
                    const docSnap = await getDoc(userDocRef);
                    if (!docSnap.exists()) {
                        await setDoc(userDocRef, {
                            displayName: user.displayName || 'Player',
                            email: user.email,
                            chips: 10000,
                            stats: { handsPlayed: 0, totalWagered: 0, netWinnings: 0, blackjacks: 0, biggestWin: 0 }
                        });
                    }
                } catch (error) {
                    console.error('Firestore error:', error);
                    // Continue to redirect even if Firestore fails
                }
                
                // Try to redirect to the game page
                try {
                    window.location.href = 'construction21.html';
                } catch (error) {
                    console.error('Redirect error:', error);
                    // Fallback - show success message
                    const successMessage = document.createElement('div');
                    successMessage.className = 'message success';
                    successMessage.textContent = 'Login successful! Welcome to Construction 21.';
                    document.querySelector('.auth-card__content').appendChild(successMessage);
                }
            }
        });
        
        loginForm.addEventListener('submit', async e => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            // Clear previous messages
            loginMessage.textContent = '';
            loginMessage.className = 'message';
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
                // onAuthStateChanged will handle the redirect
            } catch (error) {
                console.error('Login error:', error);
                loginMessage.textContent = 'Invalid credentials. Please try again.';
                loginMessage.className = 'message error';
            }
        });

        signupForm.addEventListener('submit', async e => {
            e.preventDefault();
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            
            // Clear previous messages
            signupMessage.textContent = '';
            signupMessage.className = 'message';
            
            if (password.length < 6) {
                signupMessage.textContent = 'Password must be at least 6 characters.';
                signupMessage.className = 'message error';
                return;
            }
            
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                // The onAuthStateChanged listener will handle document creation and redirect
            } catch (error) {
                console.error('Signup error:', error);
                signupMessage.textContent = 'Failed to create account. Email may already be in use.';
                signupMessage.className = 'message error';
            }
        });

        forgotForm.addEventListener('submit', async e => {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value;
            
            // Clear previous messages
            forgotMessage.textContent = '';
            forgotMessage.className = 'message';
            
            try {
                await sendPasswordResetEmail(auth, email);
                forgotMessage.textContent = 'Password reset email sent! Check your inbox.';
                forgotMessage.className = 'message success';
            } catch (error) {
                console.error('Password reset error:', error);
                forgotMessage.textContent = 'Could not send reset email. Please check the address.';
                forgotMessage.className = 'message error';
            }
        });

        googleSigninBtn.addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            
            // Clear previous messages
            loginMessage.textContent = '';
            loginMessage.className = 'message';
            
            try {
                await signInWithPopup(auth, provider);
                // onAuthStateChanged will handle the rest.
            } catch (error) {
                console.error('Google signin error:', error);
                loginMessage.textContent = 'Could not sign in with Google. Please try again.';
                loginMessage.className = 'message error';
            }
        });

    </script>
</body>
</html>

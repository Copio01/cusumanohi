<!-- Construction HammerBall (Pong) - Complete, Fully Working, Firebase Leaderboard -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=900,initial-scale=1.0">
  <title>Construction HammerBall</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      min-height: 100vh; min-width: 100vw;
      box-sizing: border-box;
      background: radial-gradient(ellipse at 60% 40%, #ffd70033 0%, #23232b 100%), linear-gradient(135deg, #23232b 0%, #2d2d3a 100%);
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow-x: hidden;
      user-select: none;
    }
    .animated-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }
    .bg-shape { position: absolute; border-radius: 50%; opacity: 0.18; filter: blur(18px); animation: floatBg 8s ease-in-out infinite alternate;}
    .bg-shape1 { width: 340px; height: 340px; background: #ffd700; left: 8vw; top: 10vh; animation-delay: 0s;}
    .bg-shape2 { width: 220px; height: 220px; background: #ff4e00; right: 10vw; top: 30vh; animation-delay: 2s;}
    .bg-shape3 { width: 180px; height: 180px; background: #00cfff; left: 30vw; bottom: 8vh; animation-delay: 4s;}
    @keyframes floatBg { to { transform: translateY(-30px) scale(1.08);} }
    #game-container {
      width: 900px; max-width: 98vw; margin: 44px auto 0 auto; position: relative; z-index: 1;
      background: rgba(255,255,255,0.97); border: 8px solid #e0a106; border-radius: 18px;
      box-shadow: 0 8px 48px #0004; padding: 32px 28px 36px 28px;
      overflow: visible;
      display: flex; flex-direction: column; align-items: center;
    }
    @media (max-width: 980px) { #game-container { width: 99vw; padding: 2vw; } }
    h1 {
      color: #e0a106; font-size: 2.1em; letter-spacing: 0.03em; text-align: center;
      margin: 0 0 26px 0; text-shadow: 2px 2px 6px #0002;
      font-weight: 800; 
    }
    #main-menu { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; padding-bottom: 2rem;}
    #main-menu label { color: #bfa14a; font-weight: 500; font-size: 1.16em;}
    #main-menu input[type="text"] {
      font-size: 1.2rem; padding: 0.5rem 1rem; border-radius: 8px;
      border: 2px solid #e0a106; width: 260px; margin-bottom: 0.5rem;
      background: #fff9ed;
    }
    #main-menu .menu-buttons { display: flex; gap: 1.2rem; margin: 1.2rem 0; flex-wrap: wrap;}
    #main-menu button, #death-screen button {
      font-size: 1.12rem; padding: 0.7rem 2.1rem; background: linear-gradient(90deg,#e0a106,#ff4e00);
      color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.11);
      transition: all 0.16s;
      margin-bottom: 0.1rem;
    }
    #main-menu button.selected {
      box-shadow: 0 0 0 3px #e0a10699; background: linear-gradient(90deg,#ffe066,#ffb347);
      color: #b36a00; font-weight: 700; transform: scale(1.08);
    }
    #main-menu button:hover, #death-screen button:hover { filter: brightness(1.14); transform: scale(1.05);}
    #main-menu button:active, #death-screen button:active { filter: brightness(0.99); }
    #start-btn { display: none; margin-top: 1.3rem; min-width: 180px; opacity: 0; transform: translateY(24px); }
    #score-area { text-align: center; margin: 10px 0 16px 0; }
    #score-label {
      font-size: 1.32em; color: #e0a106; font-weight: bold;
      background: rgba(255,255,255,0.82); padding: 7px 28px; border-radius: 14px;
      box-shadow: 1px 1px 4px #0002;
      display: inline-block;
      transition: transform 0.16s;
    }
    #score-label.score-pop { animation: score-pop 0.35s cubic-bezier(.5,1.8,.5,1) 1;}
    @keyframes score-pop { 0%{transform:scale(1);}40%{transform:scale(1.16);}100%{transform:scale(1);} }
    #game-canvas {
      display: none;
      background: #d1c089;
      border: 4px solid #bfa14a;
      margin: 0 auto 10px auto; border-radius: 11px;
      box-shadow: 0 2px 28px #e0a10619;
      transition: box-shadow 0.18s;
    }
    #game-canvas.construction-bg {
      background-image: repeating-linear-gradient(135deg, #e0a10622 0 10px, transparent 10px 20px);
    }
    #difficulty-meter { width: 100%; height: 8px; background: #fffde7; border-radius: 4px; overflow: hidden; margin: 12px 0; }
    #difficulty-bar { height: 100%; background: linear-gradient(90deg, #e0a106, #ff4e00); transition: width 0.33s; }
    /* Death screen overlay */
    #death-screen {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.97); z-index: 30; flex-direction: column;
      align-items: center; justify-content: center; gap: 2.2rem;
      border-radius: 16px;
    }
    #death-screen .score { font-size: 1.45rem; color: #ff4e00; font-weight: 600; margin-bottom: 8px;}
    #death-screen .game-over { font-size: 2.15rem; color: #e0a106; font-weight: 800; margin-bottom: 6px; }
    #death-screen .ds-buttons { display: flex; gap: 1.5rem;}
    /* Leaderboard */
    #leaderboard { margin: 32px auto 0 auto; max-width: 460px; background: #fffde7;
      border-radius: 15px; box-shadow: 0 4px 32px #0002, 0 0 0 2px #ffd70033;
      padding: 16px 20px 20px 20px; border: 2.3px solid #e0a106;
      display: none; position: relative; z-index: 2;}
    #leaderboard h2 { color: #e0a106; font-size: 1.33rem; margin: 0 0 15px 0; text-align: center; font-weight: 700;}
    #leaderboard-entries { min-height: 98px;}
    .score-entry {
      display: flex; align-items: center; justify-content: space-between;
      background: #fffbe6; border-radius: 12px; box-shadow: 1px 1px 3px #0002;
      margin-bottom: 8px; padding: 8px 20px 8px 35px; position: relative; font-size: 1.06em; border-left: 4px solid #e0a106;
      transition: background 0.18s, box-shadow 0.18s;
    }
    .score-entry:last-child { margin-bottom: 0; }
    .score-entry::before {
      content: attr(data-rank); position: absolute; left: 10px; top: 0; bottom: 0; width: 21px;
      display: flex; align-items: center; justify-content: center; color: #e0a106;
      font-weight: bold; font-size: 1.08em; opacity: 0.88;
    }
    .score-entry .player-name {
      color: #000; margin-right: 10px; background-color: #fff9ed;
      padding: 3.5px 10px; border-radius: 10px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-size: 1em;
    }
    .score-entry small { color: #555; background: #fffbe6; margin-left: 6px; border-radius: 8px; font-size: 0.83em; vertical-align: middle; }
    .score-entry .player-score {
      color: #000; font-size: 1.18em; background: #fff9ed; padding: 4px 12px;
      border-radius: 11px; min-width: 62px; text-align: center; font-weight: 700; box-shadow: 1px 2px 4px #0001;
    }
    .score-entry.current-player {
      background: #fff8d8; border-left: 5px solid #ff9900; animation: pulse-glow 2s infinite;
    }
    .score-entry.current-player .player-name {
      background: #fff1bd; border: 1px solid #ff990099; font-weight: 700;
    }
    @keyframes pulse-glow { 0%{box-shadow:0 0 5px #ff99004d;} 50%{box-shadow:0 0 16px #ff990099;} 100%{box-shadow:0 0 5px #ff99004d;} }
    .loading-spinner { width: 38px; height: 38px; margin: 22px auto; border: 4px solid #e0a10644; border-top: 4px solid #e0a106; border-radius: 50%; animation: spin 1.2s linear infinite;}
    @keyframes spin { to{ transform: rotate(360deg);} }
  </style>
</head>
<body>
  <div class="animated-bg">
    <div class="bg-shape bg-shape1"></div>
    <div class="bg-shape bg-shape2"></div>
    <div class="bg-shape bg-shape3"></div>
  </div>
  <div id="game-container">
    <h1>🔨 Construction HammerBall 🔨</h1>
    <div id="main-menu">
      <label for="player-name">Enter your name to play:</label>
      <input type="text" id="player-name" maxlength="16" placeholder="Anonymous Hammerer" autocomplete="off">
      <div class="menu-buttons">
        <button id="single-btn">Single Player</button>
        <button id="ultra-btn">Ultra (Powerups)</button>
        <button id="two-btn">Classic 2 Player</button>
      </div>
      <button id="start-btn">Start Game</button>
    </div>
    <canvas id="game-canvas" width="800" height="600"></canvas>
    <div id="score-area" style="display:none;">
      <span id="score-label">Score: 0</span>
    </div>
    <div id="difficulty-meter" style="display:none;">
      <div id="difficulty-bar"></div>
    </div>
    <div id="leaderboard" style="display:none;">
      <h2>Leaderboard</h2>
      <div id="leaderboard-entries">Loading...</div>
    </div>
    <div id="death-screen">
      <div class="game-over">Game Over</div>
      <div class="score" id="death-score">Score: 0</div>
      <div class="ds-buttons">
        <button id="replay-btn">Replay</button>
        <button id="return-menu-btn" style="background:linear-gradient(90deg,#bfa14a,#ffd700);color:#775800;">Main Menu</button>
      </div>
    </div>
  </div>
  <!-- Firebase App CDN (Modular SDK) -->
  <script src="https://www.gstatic.com/firebasejs/11.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.9.0/firebase-firestore-compat.js"></script>
  <script>
    // ----- FIREBASE CONFIG -----
    firebase.initializeApp({
      apiKey: "AIzaSyBVtq6dAEuybJNmTTv8dXBxTVUgw1t0ZMk",
      authDomain: "cusumano-website.firebaseapp.com",
      projectId: "cusumano-website",
      storageBucket: "cusumano-website.firebasestorage.app",
      messagingSenderId: "20051552210",
      appId: "1:20051552210:web:7eb3b22baa3fec184e4a0b"
    });
    const db = firebase.firestore();
    // ----------------------------

    // ---- ELEMENTS & GAME CONSTANTS ----
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const mainMenu = document.getElementById('main-menu');
    const playerNameInput = document.getElementById('player-name');
    const scoreArea = document.getElementById('score-area');
    const scoreLabel = document.getElementById('score-label');
    const singleBtn = document.getElementById('single-btn');
    const ultraBtn = document.getElementById('ultra-btn');
    const twoBtn = document.getElementById('two-btn');
    const startBtn = document.getElementById('start-btn');
    const leaderboard = document.getElementById('leaderboard');
    const leaderboardEntries = document.getElementById('leaderboard-entries');
    const difficultyMeter = document.getElementById('difficulty-meter');
    const difficultyBar = document.getElementById('difficulty-bar');
    const deathScreen = document.getElementById('death-screen');
    const deathScore = document.getElementById('death-score');
    const replayBtn = document.getElementById('replay-btn');
    const returnMenuBtn = document.getElementById('return-menu-btn');

    // Game sizes
    const FIELD_WIDTH = 800, FIELD_HEIGHT = 600;
    const PADDLE_WIDTH = 18, PADDLE_HEIGHT = 100;
    const BALL_SIZE = 22, POWERUP_SIZE = 34;
    const PADDLE_SPEED = 7, BALL_SPEED = 7;
    const MAX_BALL_SPEED = 15, ULTRA_POWERUP_DURATION = 340;
    const POWERUP_TYPES = [
      { type: "magnet", color: "#4ecaff", icon: "🧲" },
      { type: "ghost", color: "#b3b3ff", icon: "👻" },
      { type: "shield", color: "#76e6cd", icon: "🛡️" },
      { type: "drill", color: "#c0c0c0", icon: "🔩" }
    ];
    const LEADERBOARD_SIZE = 8;
    // ------------- STATE -------------
    let selectedMode = null, playerName = "", running = false;
    let gameMode = "single";
    let leftPaddle, rightPaddle, ball, powerups, activePowerups;
    let aiEnabled = false, twoPlayerControls = false;
    let score = 0, intervalId = null;

    // ---------- MENU HANDLERS ----------
    [singleBtn, ultraBtn, twoBtn].forEach(btn => btn.classList.remove('selected'));
    singleBtn.onclick = () => { selectedMode = 'single'; aiEnabled=true; twoPlayerControls=false; highlightBtn(singleBtn);}
    ultraBtn.onclick = () => { selectedMode = 'ultra'; aiEnabled=true; twoPlayerControls=false; highlightBtn(ultraBtn);}
    twoBtn.onclick = () => { selectedMode = 'twoplayer'; aiEnabled=false; twoPlayerControls=true; highlightBtn(twoBtn);}
    function highlightBtn(btn) {
      [singleBtn, ultraBtn, twoBtn].forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      showStartBtn();
    }
    function showStartBtn() { startBtn.style.display='block'; setTimeout(()=>{startBtn.style.opacity='1';startBtn.style.transform='translateY(0)';},10);}
    function hideStartBtn() { startBtn.style.opacity='0'; startBtn.style.transform='translateY(24px)'; setTimeout(()=>{startBtn.style.display='none';},390);}
    startBtn.onclick = () => {
      if(!selectedMode) return;
      playerName = playerNameInput.value.trim() || "Anonymous";
      mainMenu.style.opacity = "0"; mainMenu.style.transform="translateY(-35px)";
      setTimeout(()=>{
        mainMenu.style.display='none';
        if(selectedMode=='single') resetGame("single");
        if(selectedMode=='ultra') resetGame("ultra");
        if(selectedMode=='twoplayer') resetGame("twoplayer");
      },480);
    };

    // ------------- GAME CORE ----------------
    function resetGame(mode) {
      gameMode = mode; running = true; score = 0;
      leftPaddle = { x: 30, y: FIELD_HEIGHT/2-PADDLE_HEIGHT/2, vy: 0 };
      rightPaddle = { x: FIELD_WIDTH-48, y: FIELD_HEIGHT/2-PADDLE_HEIGHT/2, vy: 0 };
      ball = {
        x: FIELD_WIDTH/2-BALL_SIZE/2,
        y: FIELD_HEIGHT/2-BALL_SIZE/2,
        vx: (BALL_SPEED+(Math.random()-0.5)*2)*(Math.random()>0.5?1:-1),
        vy: (BALL_SPEED/1.2)*(Math.random()*2-1)
      };
      ball._subx=ball.x; ball._suby=ball.y;
      powerups = []; activePowerups=[];
      scoreLabel.textContent = "Score: 0";
      canvas.style.display='block'; scoreArea.style.display='block';
      difficultyMeter.style.display = (mode=="ultra") ? "block":"none";
      updateDifficultyBar();
      canvas.classList.add('construction-bg');
      deathScreen.style.display = 'none';
      leaderboard.style.display = 'none';
      // Responsive canvas
      canvas.width=FIELD_WIDTH; canvas.height=FIELD_HEIGHT;
      // Keyboard state
      leftPaddleUp=false; leftPaddleDown=false; rightPaddleUp=false; rightPaddleDown=false;
      // Run
      if(intervalId) clearInterval(intervalId);
      intervalId = setInterval(gameLoop, 1000/60);
    }

    function updateDifficultyBar() {
      if(gameMode!="ultra") return;
      const base = BALL_SPEED, max=MAX_BALL_SPEED;
      let percent = Math.min(100, 100*(Math.abs(ball.vx)-base)/(max-base));
      difficultyBar.style.width = percent+'%';
    }

    function animateScorePop() {
      scoreLabel.classList.remove('score-pop'); void scoreLabel.offsetWidth;
      scoreLabel.classList.add('score-pop');
    }

    // ---------- DRAW -------------
    function drawField() {
      ctx.fillStyle='#e8ddb7'; ctx.fillRect(0,0,FIELD_WIDTH,FIELD_HEIGHT);
      // Center line dash
      ctx.save(); ctx.strokeStyle='#bfa14a'; ctx.setLineDash([16,16]);
      ctx.lineWidth=4; ctx.globalAlpha=0.7; ctx.beginPath();
      let dashOffset = (Date.now()/30)%32; ctx.lineDashOffset=-dashOffset;
      ctx.moveTo(FIELD_WIDTH/2,0); ctx.lineTo(FIELD_WIDTH/2,FIELD_HEIGHT); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha=1;
      // Construction cones
      for(let i=0;i<3;i++){
        let cx=FIELD_WIDTH/2-18+(i-1)*60, cy=60+i*120+20*Math.sin(Date.now()/600+i);
        ctx.save(); ctx.translate(cx,cy); ctx.beginPath();
        ctx.moveTo(0,18);ctx.lineTo(-12,-18);ctx.lineTo(12,-18);ctx.closePath();
        ctx.fillStyle='#ff4e00';ctx.fill();
        ctx.fillStyle='#fff';ctx.fillRect(-8,-8,16,4);
        ctx.restore();
      }
      ctx.restore();
    }
    function drawPaddle(p,isLeft){
      ctx.save();
      ctx.fillStyle=isLeft?'#e0a106':'#ff4e00'; ctx.shadowColor='#bfa14a'; ctx.shadowBlur=8;
      ctx.fillRect(p.x,p.y,PADDLE_WIDTH,PADDLE_HEIGHT);
      for(let i=0;i<3;i++){
        ctx.beginPath(); ctx.arc(p.x+PADDLE_WIDTH/2,p.y+18+i*32,3,0,2*Math.PI);
        ctx.fillStyle='#bfa14a';ctx.fill();
      }
      ctx.restore();
    }
    function drawBall(){
      ctx.save();
      if(activePowerups.length>0){
        for(let i=0;i<6;i++){
          ctx.globalAlpha=0.08+0.04*i; ctx.beginPath();
          ctx.arc(ball.x+BALL_SIZE/2-ball.vx*i*2,ball.y+BALL_SIZE/2-ball.vy*i*2,BALL_SIZE/2,0,2*Math.PI);
          ctx.fillStyle='#e0a106'; ctx.fill();
        }
      }
      ctx.globalAlpha=1;
      let cx=ball.x+BALL_SIZE/2, cy=ball.y+BALL_SIZE/2;
      const spinSpeed=0.13; drawBall._angle=(drawBall._angle||0)+spinSpeed;
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(drawBall._angle);
      ctx.beginPath(); ctx.rect(-BALL_SIZE*0.09, BALL_SIZE*0.19, BALL_SIZE*0.18, BALL_SIZE*0.84);
      ctx.fillStyle='#bfa14a'; ctx.shadowColor='#e0a106'; ctx.shadowBlur=5; ctx.fill(); ctx.shadowBlur=0;
      ctx.beginPath(); ctx.rect(-BALL_SIZE*0.35, -BALL_SIZE*0.19, BALL_SIZE*0.7, BALL_SIZE*0.38);
      ctx.fillStyle='#888'; ctx.strokeStyle='#444'; ctx.lineWidth=2.1; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(BALL_SIZE*0.35, 0, BALL_SIZE*0.19, 0, 2*Math.PI);
      ctx.fillStyle='#e0a106'; ctx.strokeStyle='#bfa14a'; ctx.lineWidth=1.1; ctx.fill(); ctx.stroke();
      ctx.restore();
      ctx.restore();
    }
    function drawPowerups(){
      for(const p of powerups){
        ctx.save();
        ctx.beginPath(); ctx.arc(p.x+POWERUP_SIZE/2,p.y+POWERUP_SIZE/2,POWERUP_SIZE/2,0,2*Math.PI);
        ctx.fillStyle=p.color; ctx.globalAlpha=0.78+0.22*Math.sin(Date.now()/210); ctx.shadowColor=p.color; ctx.shadowBlur=13; ctx.fill(); ctx.shadowBlur=0;
        ctx.globalAlpha=1; ctx.font='23px Segoe UI'; ctx.textAlign='center'; ctx.textBaseline='middle';
        let floatY=4*Math.sin(Date.now()/160+p.x); ctx.fillText(p.icon,p.x+POWERUP_SIZE/2,p.y+POWERUP_SIZE/2+floatY+1);
        ctx.restore();
      }
    }
    function drawHUD(){
      if(gameMode=="ultra"&&activePowerups.length>0){
        ctx.save();
        ctx.globalAlpha=1; ctx.font='bold 17px Segoe UI'; ctx.textAlign='left'; ctx.textBaseline='top';
        ctx.save(); ctx.beginPath(); ctx.moveTo(12,12); ctx.lineTo(160,12); ctx.lineTo(160,22+activePowerups.length*35); ctx.lineTo(12,22+activePowerups.length*35); ctx.closePath();
        ctx.fillStyle='rgba(255,255,255,0.88)'; ctx.strokeStyle='#e0a106'; ctx.lineWidth=2; ctx.fill(); ctx.stroke(); ctx.restore();
        let hudY=18;
        for(const ap of activePowerups){
          let details=POWERUP_TYPES.find(p=>p.type==ap.type); if(!details)continue;
          let pulse=1+0.07*Math.sin(Date.now()/170+hudY);
          ctx.save(); ctx.translate(32,hudY+12); ctx.scale(pulse,pulse); ctx.fillText(details.icon,0,0); ctx.restore();
          ctx.fillStyle=details.color; ctx.fillText(` ${details.type.charAt(0).toUpperCase()+details.type.slice(1)}`,48,hudY);
          ctx.save(); ctx.fillStyle='rgba(60,60,60,0.7)'; ctx.fillRect(20,hudY+22,100,7);
          ctx.fillStyle=details.color; ctx.fillRect(20,hudY+22,100*(ap.timer/ULTRA_POWERUP_DURATION),7); ctx.restore();
          hudY+=35;
        }
        ctx.restore();
      }
    }
    function drawGame(){
      drawField();
      drawPaddle(leftPaddle,true); drawPaddle(rightPaddle,false);
      drawBall();
      if(gameMode=="ultra")drawPowerups();
      drawHUD();
    }

    // --------- GAME LOOP ----------
    let leftPaddleUp=false, leftPaddleDown=false, rightPaddleUp=false, rightPaddleDown=false;
    function gameLoop(){
      // --- PADDLE MOVEMENT ---
      const paddleEasing = 0.3;
      if(twoPlayerControls){
        let tVyL=0, tVyR=0;
        if(leftPaddleUp&&!leftPaddleDown) tVyL=-PADDLE_SPEED;
        else if(leftPaddleDown&&!leftPaddleUp) tVyL=PADDLE_SPEED;
        leftPaddle.vy+=(tVyL-leftPaddle.vy)*paddleEasing;
        if(rightPaddleUp&&!rightPaddleDown) tVyR=-PADDLE_SPEED;
        else if(rightPaddleDown&&!rightPaddleUp) tVyR=PADDLE_SPEED;
        rightPaddle.vy+=(tVyR-rightPaddle.vy)*paddleEasing;
      }
      else if(aiEnabled){
        let tVy=0;
        if(ball.y+BALL_SIZE/2 < rightPaddle.y+PADDLE_HEIGHT/2-10) tVy=-PADDLE_SPEED;
        else if(ball.y+BALL_SIZE/2 > rightPaddle.y+PADDLE_HEIGHT/2+10) tVy=PADDLE_SPEED;
        rightPaddle.vy+=(tVy-rightPaddle.vy)*paddleEasing;
      }
      leftPaddle.y+=leftPaddle.vy; rightPaddle.y+=rightPaddle.vy;
      leftPaddle.y=Math.max(0,Math.min(FIELD_HEIGHT-PADDLE_HEIGHT,leftPaddle.y));
      rightPaddle.y=Math.max(0,Math.min(FIELD_HEIGHT-PADDLE_HEIGHT,rightPaddle.y));

      // --- BALL ---
      ball._subx+=ball.vx; ball._suby+=ball.vy; ball.x=ball._subx; ball.y=ball._suby;
      // Top/bottom walls
      if(ball.y<=0){ ball.y=0; ball._suby=ball.y; ball.vy*=-1;}
      else if(ball.y+BALL_SIZE>=FIELD_HEIGHT){ ball.y=FIELD_HEIGHT-BALL_SIZE; ball._suby=ball.y; ball.vy*=-1;}

      // --- POWERUPS (ULTRA ONLY) ---
      if(gameMode=="ultra"){
        if(Math.random()<0.008 && powerups.length<1){
          let pt = POWERUP_TYPES[Math.floor(Math.random()*POWERUP_TYPES.length)];
          powerups.push({
            ...pt,
            x: Math.random()*(FIELD_WIDTH-POWERUP_SIZE-40)+20,
            y: Math.random()*(FIELD_HEIGHT-POWERUP_SIZE-40)+20
          });
        }
        // Collect powerups
        for(let i=powerups.length-1;i>=0;i--){
          let p=powerups[i];
          let dx=(ball.x+BALL_SIZE/2)-(p.x+POWERUP_SIZE/2), dy=(ball.y+BALL_SIZE/2)-(p.y+POWERUP_SIZE/2);
          if(Math.sqrt(dx*dx+dy*dy)<BALL_SIZE/2+POWERUP_SIZE/2){
            activePowerups.push({type:p.type, timer:ULTRA_POWERUP_DURATION});
            powerups.splice(i,1);
          }
        }
        // Timer down
        for(let i=activePowerups.length-1;i>=0;i--){
          activePowerups[i].timer--;
          if(activePowerups[i].timer<=0) activePowerups.splice(i,1);
        }
        // Increase ball speed
        if(score>0&&score%90==0 && Math.abs(ball.vx)<MAX_BALL_SPEED){
          ball.vx*=1.13; ball.vy*=1.11; updateDifficultyBar();
        }
        updateDifficultyBar();
        applyPowerupEffects();
      }

      // Paddle collision
      if(ball.x<=leftPaddle.x+PADDLE_WIDTH && ball.y+BALL_SIZE>leftPaddle.y && ball.y<leftPaddle.y+PADDLE_HEIGHT && ball.vx<0){
        ball.x=leftPaddle.x+PADDLE_WIDTH; ball._subx=ball.x; ball.vx*=-1; animateScorePop();
      }
      if(ball.x+BALL_SIZE>=rightPaddle.x && ball.y+BALL_SIZE>rightPaddle.y && ball.y<rightPaddle.y+PADDLE_HEIGHT && ball.vx>0){
        ball.x=rightPaddle.x-BALL_SIZE; ball._subx=ball.x; ball.vx*=-1; animateScorePop();
      }
      // Out of bounds (end game)
      if(ball.x<0 || ball.x>FIELD_WIDTH){ endGame(); return;}
      // Score update
      score++; scoreLabel.textContent=`Score: ${score}`;
      ctx.clearRect(0,0,FIELD_WIDTH,FIELD_HEIGHT);
      drawGame();
    }

    // --------- POWERUP EFFECTS (Ultra) ---------
    function applyPowerupEffects(){
      // Magnet: curve toward left paddle if moving left
      if(activePowerups.some(p=>p.type=="magnet")&&ball.vx<0){
        let paddleCenter=leftPaddle.y+PADDLE_HEIGHT/2, ballCenter=ball.y+BALL_SIZE/2, diff=paddleCenter-ballCenter;
        ball.vy+=0.11*Math.sign(diff); ball.vy=Math.max(-MAX_BALL_SPEED,Math.min(MAX_BALL_SPEED,ball.vy));
      }
      // Ghost: ball passes through left paddle once
      if(activePowerups.some(p=>p.type=="ghost")&&ball.x<=leftPaddle.x+PADDLE_WIDTH&&ball.y+BALL_SIZE>leftPaddle.y&&ball.y<leftPaddle.y+PADDLE_HEIGHT&&ball.vx<0){
        let idx=activePowerups.findIndex(p=>p.type=="ghost"); if(idx!=-1){
          activePowerups.splice(idx,1); ball.x=leftPaddle.x+PADDLE_WIDTH+3;
        }
      }
      // Shield: ball reflects off left wall once
      if(activePowerups.some(p=>p.type=="shield")&&ball.x<0&&ball.vx<0){
        let idx=activePowerups.findIndex(p=>p.type=="shield"); if(idx!=-1){
          activePowerups.splice(idx,1); ball.x=2; ball.vx*=-1;
        }
      }
      // Drill: ball pierces through left paddle, bounces off left wall
      if(activePowerups.some(p=>p.type=="drill")&&ball.x<=leftPaddle.x+PADDLE_WIDTH&&ball.y+BALL_SIZE>leftPaddle.y&&ball.y<leftPaddle.y+PADDLE_HEIGHT&&ball.vx<0){
        let idx=activePowerups.findIndex(p=>p.type=="drill"); if(idx!=-1){
          activePowerups.splice(idx,1); ball.x=2; ball.vx*=-1;
        }
      }
    }

    // -------- KEYBOARD -----------
    document.addEventListener('keydown', e=>{
      if(!running)return;
      if(twoPlayerControls){
        if(e.key=='w'||e.key=='W') leftPaddleUp=true;
        if(e.key=='s'||e.key=='S') leftPaddleDown=true;
        if(e.key=='ArrowUp') rightPaddleUp=true;
        if(e.key=='ArrowDown') rightPaddleDown=true;
      }else{
        if(e.key=='w'||e.key=='ArrowUp') leftPaddle.vy=-PADDLE_SPEED;
        if(e.key=='s'||e.key=='ArrowDown') leftPaddle.vy=PADDLE_SPEED;
      }
    });
    document.addEventListener('keyup', e=>{
      if(!running)return;
      if(twoPlayerControls){
        if(e.key=='w'||e.key=='W') leftPaddleUp=false;
        if(e.key=='s'||e.key=='S') leftPaddleDown=false;
        if(e.key=='ArrowUp') rightPaddleUp=false;
        if(e.key=='ArrowDown') rightPaddleDown=false;
      }else{
        if(e.key=='w'||e.key=='ArrowUp') leftPaddle.vy=0;
        if(e.key=='s'||e.key=='ArrowDown') leftPaddle.vy=0;
      }
    });

    // -------- END GAME & LEADERBOARD ----------
    function endGame(){
      running=false; clearInterval(intervalId);
      deathScore.textContent=`Score: ${score}`;
      deathScreen.style.display='flex';
      canvas.style.display='none'; scoreArea.style.display='none'; difficultyMeter.style.display='none';
      if(gameMode!="twoplayer"){ leaderboard.style.display='block'; submitScore(playerName,score);}
      updateLeaderboard();
    }
    replayBtn.onclick = () => {
      deathScreen.style.display='none'; leaderboard.style.display='none';
      scoreArea.style.display='block'; canvas.style.display='block';
      resetGame(selectedMode);
    };
    returnMenuBtn.onclick = () => {
      deathScreen.style.display='none'; leaderboard.style.display='block';
      mainMenu.style.display='flex'; canvas.style.display='none';
      scoreArea.style.display='none'; difficultyMeter.style.display='none';
    };

    // ----- FIREBASE LEADERBOARD -----
    function submitScore(name, finalScore){
      if(gameMode=="twoplayer"||finalScore<=0) return;
      db.collection("hammerballLeaderboard").add({
        name: name, score: finalScore, mode: gameMode, ts: firebase.firestore.FieldValue.serverTimestamp()
      }).then(()=>{ updateLeaderboard(); }).catch(err=>{console.error("Firebase submit error",err);});
    }
    function updateLeaderboard(){
      leaderboardEntries.className=''; leaderboardEntries.innerHTML='<div class="loading-spinner"></div>';
      db.collection("hammerballLeaderboard").orderBy("score","desc").limit(LEADERBOARD_SIZE).get()
      .then(qs=>{
        leaderboardEntries.innerHTML="";
        if(qs.empty){ leaderboardEntries.innerHTML='<div style="text-align:center;padding:24px;color:#ffcc33;"><div style="font-size:38px;margin-bottom:12px;">🏆</div><div>No scores yet!</div></div>'; return;}
        let rank=1;
        qs.forEach(doc=>{
          let s=doc.data();
          let div=document.createElement('div');
          div.className="score-entry"; div.setAttribute('data-rank',rank);
          let modeClass=s.mode=="ultra"?"ultra-mode":"classic-mode";
          div.innerHTML=`<span class="player-name">${s.name} <small class="${modeClass}">(${s.mode})</small></span><span class="player-score">${s.score}</span>`;
          leaderboardEntries.appendChild(div); rank++;
        });
      })
      .catch(e=>{
        leaderboardEntries.innerHTML = `<div style="text-align:center;padding:20px;color:#ff6b6b;"><div style="font-size:24px;margin-bottom:10px;">⚠️</div><div>Error loading scores</div><div style="font-size:0.9em;opacity:0.7;margin-top:5px;">Please try again later</div></div>`;
      });
    }

    // ---- INIT SHOW LEADERBOARD ON LOAD ----
    mainMenu.style.display='flex'; leaderboard.style.display='block';
    updateLeaderboard();
    deathScreen.style.display='none';

  </script>
</body>
</html>
